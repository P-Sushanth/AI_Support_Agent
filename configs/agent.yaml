model:
  provider: "mock" # options: mock, openai, gemini
  name: "support-agent-v1"
  temperature: 0.0
  max_tokens: 500

prompt:
  version: "system_v1"
  path: "prompts/system_v1.txt"

escalation_policy:
  security_hack: true
  corporate_tax_wire: true
  out_of_policy_exception: true
  explicit_human_request: true
  insufficient_context: true

caching:
  enabled: true
  cache_dir: "results/baseline/cache"
