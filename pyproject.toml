[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-support-agent"
version = "0.1.0"
description = "AI Customer Support Agent Evaluation and Misleading Headline Analysis"
authors = [{ name = "AI Engineering Team" }]
dependencies = [
    "pandas",
    "numpy",
    "pydantic",
    "pyyaml",
    "pytest"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
