model:
  provider: "ollama" # options: ollama, mock, openai, gemini
  name: "qwen3.5:2b" # available local models: qwen3.5:2b, qwen3.5:9b, gemma4:12b
  temperature: 0.0
  max_tokens: 500
  ollama_host: "http://localhost:11434"

prompt:
  version: "system_v1"
  path: "prompts/system_v1.txt"

escalation_policy:
  security_hack: true
  corporate_tax_wire: true
  out_of_policy_exception: true
  explicit_human_request: true
  insufficient_context: true

caching:
  enabled: true
  cache_dir: "results/baseline/cache"
